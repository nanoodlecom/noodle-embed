name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22.23.4", "24.22.1", "26.12.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Zero npm deps and no lockfile — nothing to install; node --test runs
      # the offline suite directly.
      - run: npm test
